<!doctype html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8">
  <title>eCity · Consultas de transacciones por máquina</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Dashboard de solo lectura para consultar transacciones por máquina (Pay+) sobre Api_DashboardV2.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f5ce0'/><path d='M10 21h12M10 15h12M10 11h6' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>">
</head>
  <!-- Config runtime PRODUCCIÓN: puedes cambiar apiBaseAddress sin recompilar.
       Estas credenciales son las que me diste (apidashboardv2.e-city.co).
       MODO 1 (directo, para deploy en servidor distinto): deja baseUrl con https://...
       MODO 2 (proxy, para npm start local sin CORS): cambia baseUrl a '' y usa npm run start:api:prod
       Si ves "No hay conexión" desde el preview de Arena, es normal: Arena no tiene VPN.
       Prueba desde tu PC en Medellín con VPN activa. -->
  <script>
    window.__DASHBOARD_CONFIG__ = {
      dataProvider: 'http',
      api: {
        baseUrl: 'https://apidashboardv2.e-city.co',
        pathPrefix: 'api',
        dashboardKeyId: '1E4F66B8-8602-4F9F-9AAC-F1D329A4AB1D'
      }
    };
    // Para modo PROXY local, comenta el bloque de arriba y descomenta este:
    // window.__DASHBOARD_CONFIG__ = { dataProvider: 'http', api: { baseUrl: '', pathPrefix: 'api', dashboardKeyId: '1E4F66B8-8602-4F9F-9AAC-F1D329A4AB1D' } };
  </script>
<body class="h-full bg-surface-light text-slate-800 antialiased dark:bg-surface-dark dark:text-slate-200">
  <app-root></app-root>
</body>
</html>
